[project]
name = "fieldcatalog-worker"
version = "0.1.0"
description = "Field Catalog local worker — previews, cull, disk delete/offload"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10", "numpy>=1.26", "send2trash>=1.8"]

[project.optional-dependencies]
raw = ["rawpy"]
dev = ["pytest"]

[project.scripts]
fieldcatalog = "fieldcatalog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
